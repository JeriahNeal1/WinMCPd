# High-trust personal lab option. Use only on an owner-authorized machine.
# The platform still writes redacted audit logs; this only changes Codex prompting policy.
[mcp_servers.windows_power_user_lab]
command = "C:\\Tools\\WindowsPowerUserMcp\\WindowsPowerUserMcp.App.exe"
args = ["--stdio"]
